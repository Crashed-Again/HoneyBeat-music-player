name: Build HoneyBeat

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Download fonts (Outfit + Oxanium)
        run: |
          mkdir -p app/src/main/assets/fonts
          curl -fsSL "https://github.com/google/fonts/raw/main/ofl/outfit/Outfit%5Bwght%5D.ttf" -o app/src/main/assets/fonts/outfit.ttf || rm -f app/src/main/assets/fonts/outfit.ttf
          curl -fsSL "https://github.com/google/fonts/raw/main/ofl/oxanium/Oxanium%5Bwght%5D.ttf" -o app/src/main/assets/fonts/oxanium.ttf || rm -f app/src/main/assets/fonts/oxanium.ttf
          ls -la app/src/main/assets/fonts

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: HoneyBeat-apk
          path: app/build/outputs/apk/release/*.apk
