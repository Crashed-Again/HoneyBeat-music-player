name: Build HoneyBeat (Metrolist-based)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout this repo (scripts + overlay)
        uses: actions/checkout@v4

      - name: Clone upstream Metrolist
        run: git clone --depth 1 --recurse-submodules https://github.com/MetrolistGroup/Metrolist.git upstream

      - name: Rename Metrolist -> HoneyBeat
        working-directory: upstream
        run: bash ../rename_to_honeybeat.sh

      - name: Add HoneyBeat UI kit
        run: |
          mkdir -p upstream/app/src/main/kotlin/com/neonbear/honeybeat/ui
          cp overlay/HoneyBeatUi.kt upstream/app/src/main/kotlin/com/neonbear/honeybeat/ui/HoneyBeatUi.kt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK(s)
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK(s)
        uses: actions/upload-artifact@v4
        with:
          name: HoneyBeat-apk
          path: upstream/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
