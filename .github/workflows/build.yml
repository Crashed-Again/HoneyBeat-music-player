name: Build HoneyBeat (Metrolist-based)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout this repo (scripts + overlay)
        uses: actions/checkout@v4

      - name: Clone upstream Metrolist
        run: git clone --depth 1 --recurse-submodules https://github.com/MetrolistGroup/Metrolist.git upstream

      - name: Rename app (name + application id)
        working-directory: upstream
        run: bash ../rename_to_honeybeat.sh

      - name: Apply HoneyBeat logo and UI kit
        run: |
          # logo resources
          cp -r overlay/res/. upstream/app/src/main/res/
          # overwrite every existing adaptive launcher icon definition
          find upstream/app/src -path '*mipmap-anydpi*' -name 'ic_launcher*.xml' | while read -r f; do
            cp overlay/res/mipmap-anydpi-v26/ic_launcher.xml "$f"
          done
          # UI kit (theme, cards, floating nav, NeonBear footer)
          mkdir -p upstream/app/src/main/kotlin/com/neonbear/honeybeat/ui
          cp overlay/HoneyBeatUi.kt upstream/app/src/main/kotlin/com/neonbear/honeybeat/ui/HoneyBeatUi.kt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/debug.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HoneyBeat-apk
          path: upstream/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
